<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroTruth Sydney Quick Glance</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #38BDF8, #0284C7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      color: white;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .sub {
      font-size: 11px;
      color: #64748B;
    }
    .status-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 11px;
      font-weight: 700;
      color: #38BDF8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .status-text {
      font-size: 12px;
      color: #E2E8F0;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #38BDF8, #0284C7);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <div>
      <div class="title">MicroTruth Sydney</div>
      <div class="sub">Microburbs Hackathon 2026</div>
    </div>
  </div>

  <div class="status-box">
    <div class="status-title">Active Protection</div>
    <div class="status-text" id="status-text">Ready on Domain.com.au & Realestate.com.au. Underquoting and hazard scanner active.</div>
  </div>

  <button id="btn-open-panel" class="btn">
    <span>🔍 Open Reality Side Panel</span>
  </button>

  <div class="footer">City of Sydney 29 Suburbs Covered</div>

  <script>
    document.getElementById("btn-open-panel").addEventListener("click", () => {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        if (tabs[0]?.id && chrome.sidePanel && chrome.sidePanel.open) {
          chrome.sidePanel.open({ tabId: tabs[0].id });
          window.close();
        }
      });
    });
  </script>
</body>
</html>
